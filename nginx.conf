server {
    listen 8080;
    server_name _;
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $bookstore_backend http://backend:8080;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 5m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /.well-known/acme-challenge/ { root /var/www/acme; try_files $uri =404; }
    location /api/ {
        proxy_pass $bookstore_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }
    location = /api/health {
        proxy_pass $bookstore_backend/actuator/health/readiness;
        add_header Cache-Control "no-store";
    }
    location / { try_files $uri $uri/ /index.html; }
}
