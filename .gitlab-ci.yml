image: node:16

stages:
  - deploy

deploy:
  stage: deploy
  script:
    - apt-get update -qq && apt-get install -y -qq ssh
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts
    - ssh -i ~/.ssh/id_ed25519 root@$SERVER_IP "cd $DEPLOY_PATH_FRONTEND && git pull && npm install && npm run build"
  only:
    - main