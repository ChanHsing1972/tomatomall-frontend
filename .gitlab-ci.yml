image: node:16

stages:
  - build
  - deploy

# 缓存依赖项加速构建
cache:
  paths:
    - node_modules/

# 构建阶段
build:
  stage: build
  script:
    - echo "安装依赖..."
    - npm ci
    - echo "构建前端应用..."
    - npm run build
    - echo "检查构建产物..."
    - ls -la dist/
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

# 部署阶段
deploy:
  stage: deploy
  needs:
    - build  # 明确依赖构建作业
  before_script:
    - apt-get update -qq && apt-get install -y -qq ssh git
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts
    - echo "检查要部署的文件..."
    - ls -la dist/
  script:
    - echo "正在部署前端应用到服务器..."
    - ssh -i ~/.ssh/id_rsa root@$SERVER_IP "mkdir -p $DEPLOY_PATH_FRONTEND/dist-new"
    - scp -i ~/.ssh/id_rsa -r dist/* root@$SERVER_IP:$DEPLOY_PATH_FRONTEND/dist-new/
    - ssh -i ~/.ssh/id_rsa root@$SERVER_IP "cd $DEPLOY_PATH_FRONTEND && ls -la dist-new/"
    - ssh -i ~/.ssh/id_rsa root@$SERVER_IP "cd $DEPLOY_PATH_FRONTEND && rm -rf dist-old && [ -d dist ] && mv dist dist-old || true && mv dist-new dist"
  only:
    - main